[package]
name = "streamovie-mac"
version = "0.1.0"
edition = "2024"
description = "Native macOS desktop application for Streamovie built with Rust, GPUI, and uni-kit (gpui-kit)."
authors = ["Streamovie Contributors"]
license = "Apache-2.0"

[[bin]]
name = "streamovie-mac"
path = "src/main.rs"

[dependencies]
# uni-kit GPUI umbrella crate (re-exports gpui, gpui_platform, gpui-base, gpui-component, gpui-kit-assets)
gpui-kit = { git = "https://github.com/MohsenDastaran/uni-kit", package = "gpui-kit", version = "0.7.1" }
gpui-wry = { git = "https://github.com/MohsenDastaran/uni-kit", package = "gpui-wry", version = "0.7.1" }
wry = { package = "lb-wry", version = "0.53.3" }

# HTTP transport for GPUI remote image loading and catalog/OMDb requests
reqwest_client = { package = "gpui-pre-reqwest-client", version = "=0.3.8" }
reqwest = { package = "gpui-pre-reqwest", version = "=0.12.15", default-features = false, features = [
    "blocking",
    "charset",
    "http2",
    "macos-system-configuration",
    "rustls-tls-native-roots",
] }

anyhow = "1.0"
raw-window-handle = "0.6"
dirs = "6.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
smol = "2.0"
tracing = "0.1"
urlencoding = "2.1"

[profile.dev]
codegen-units = 16
debug = "limited"
split-debuginfo = "unpacked"

[profile.dev.package]
resvg = { opt-level = 3 }
rustybuzz = { opt-level = 3 }
taffy = { opt-level = 3 }
ttf-parser = { opt-level = 3 }
smol = { opt-level = 3 }
gpui-pre = { opt-level = 3 }
gpui-pre-platform = { opt-level = 3 }
gpui-pre-macros = { opt-level = 3 }
gpui-pre-sum-tree = { opt-level = 3 }
ropey = { opt-level = 3 }
gpui-pre-reqwest-client = { opt-level = 3 }
