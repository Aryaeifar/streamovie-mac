name: macOS build

on:
  push:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache Cargo
        uses: Swatinem/rust-cache@v2

      - name: Build release
        run: cargo build --release

      - name: Package Streamovie.app
        run: |
          set -euo pipefail
          APP="Streamovie.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp target/release/streamovie-mac "$APP/Contents/MacOS/streamovie-mac"
          chmod +x "$APP/Contents/MacOS/streamovie-mac"
          cp assets/AppIcon.icns "$APP/Contents/Resources/AppIcon.icns"
          python3 - <<'PY'
          from pathlib import Path
          Path("Streamovie.app/Contents/Info.plist").write_text("""<?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>CFBundleName</key>
            <string>Streamovie</string>
            <key>CFBundleDisplayName</key>
            <string>Streamovie</string>
            <key>CFBundleIdentifier</key>
            <string>com.streamovie.mac</string>
            <key>CFBundleVersion</key>
            <string>0.1.0</string>
            <key>CFBundleShortVersionString</key>
            <string>0.1.0</string>
            <key>CFBundleExecutable</key>
            <string>streamovie-mac</string>
            <key>CFBundleIconFile</key>
            <string>AppIcon</string>
            <key>CFBundlePackageType</key>
            <string>APPL</string>
            <key>LSMinimumSystemVersion</key>
            <string>13.0</string>
            <key>LSApplicationCategoryType</key>
            <string>public.app-category.entertainment</string>
            <key>NSHighResolutionCapable</key>
            <true/>
          </dict>
          </plist>
          """)
          PY
          # GitHub downloads get a quarantine flag. An ad-hoc signature keeps
          # the bundle valid so macOS does not report it as damaged.
          xattr -cr "$APP"
          codesign --force --sign - --identifier com.streamovie.mac "$APP"
          codesign --verify --strict --verbose=2 "$APP"
          STAGE="$(mktemp -d)"
          cp -R "$APP" "$STAGE/"
          ln -s /Applications "$STAGE/Applications"
          hdiutil create \
            -volname "Streamovie" \
            -srcfolder "$STAGE" \
            -ov \
            -format UDZO \
            "Streamovie-mac.dmg"

      - name: Upload build
        id: upload
        continue-on-error: true
        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: 2
        with:
          name: Streamovie-mac
          path: Streamovie-mac.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

      - name: Wait before upload retry
        if: steps.upload.outcome == 'failure'
        run: sleep 45

      - name: Upload build again
        id: upload-retry
        if: steps.upload.outcome == 'failure'
        continue-on-error: true
        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: 2
        with:
          name: Streamovie-mac
          path: Streamovie-mac.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14

      - name: Wait before final upload
        if: steps.upload.outcome == 'failure' && steps.upload-retry.outcome == 'failure'
        run: sleep 90

      - name: Upload build final attempt
        if: steps.upload.outcome == 'failure' && steps.upload-retry.outcome == 'failure'
        uses: actions/upload-artifact@v4
        env:
          ACTIONS_ARTIFACT_UPLOAD_CONCURRENCY: 2
        with:
          name: Streamovie-mac
          path: Streamovie-mac.dmg
          if-no-files-found: error
          compression-level: 0
          overwrite: true
          retention-days: 14
